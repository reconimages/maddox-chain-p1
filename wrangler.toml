name = "maddoxchain"
main = ".open-next/worker.js"
compatibility_date = "2026-11-04"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = true

routes = [
  { pattern = "maddoxchain.fans", custom_domain = true },
  { pattern = "www.maddoxchain.fans", custom_domain = true },
]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[observability]
enabled = true
